name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check:public-identifiers
      - run: npm run check:docs
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  trigger-deploy:
    name: Trigger private deploy
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Dispatch cloudflare-config deploy
        env:
          DISPATCH_TOKEN: ${{ secrets.CLOUDFLARE_CONFIG_DISPATCH_TOKEN }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_CONFIG_DISPATCH_TOKEN is not set; skipping private deploy dispatch."
            exit 0
          fi

          curl -fsSL \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/djpardis/cloudflare-config/dispatches \
            -d "$(node -e 'console.log(JSON.stringify({ event_type: "deploy-newsletter", client_payload: { deployment: "all", source_sha: process.env.GITHUB_SHA } }))')"
